# =============================================================
# docker-compose для production развёртывания на Hetzner CX22
#
# Сервисы:
#   - flagship: статика Astro + Caddy (auto HTTPS + PQC TLS)
#   - listmonk: email-рассылка (заменит Mailerlite после теста)
#   - listmonk-db: PostgreSQL для Listmonk
#   - plausible: cookieless аналитика (опционально, включается профилем)
#
# Запуск:
#   docker compose --env-file .env up -d flagship listmonk listmonk-db
#
# С аналитикой:
#   docker compose --profile analytics up -d
# =============================================================

services:
  # ----------------------------------------------------------
  # Основной сайт + reverse proxy для всех сервисов
  # ----------------------------------------------------------
  flagship:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: marshrut/flagship:latest
    container_name: marshrut_flagship
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
      SITE_DOMAIN: ${SITE_DOMAIN:-marshrut.eu}
      SITE_DOMAIN_WWW: ${SITE_DOMAIN_WWW:-www.marshrut.eu}
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # Listmonk — email-рассылка (self-hosted Mailerlite-замена)
  # ----------------------------------------------------------
  listmonk:
    image: listmonk/listmonk:latest
    container_name: marshrut_listmonk
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${LISTMONK_DB_USER:?required}
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:?required}
      LISTMONK_db__database: ${LISTMONK_DB_NAME:-listmonk}
      LISTMONK_db__ssl_mode: disable
      TZ: Europe/Warsaw
    # Listmonk слушает только локально — снаружи через Caddy на newsletter.marshrut.eu
    expose:
      - "9000"
    networks:
      - web
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  listmonk-db:
    image: postgres:17-alpine
    container_name: marshrut_listmonk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LISTMONK_DB_USER:?required}
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:?required}
      POSTGRES_DB: ${LISTMONK_DB_NAME:-listmonk}
    # БД доступна только из internal сети — наружу не торчит
    expose:
      - "5432"
    volumes:
      - listmonk_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------
  # Plausible Analytics — cookieless, GDPR-safe
  # Включить: docker compose --profile analytics up -d
  # ----------------------------------------------------------
  plausible:
    image: plausible/community-edition:latest
    container_name: marshrut_plausible
    profiles: ["analytics"]
    restart: unless-stopped
    depends_on:
      plausible-db:
        condition: service_healthy
    environment:
      BASE_URL: https://analytics.marshrut.eu
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY:?run 'openssl rand -base64 48' and put in .env}
      DATABASE_URL: postgres://${PLAUSIBLE_DB_USER:?required}:${PLAUSIBLE_DB_PASSWORD:?required}@plausible-db:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://plausible-clickhouse:8123/plausible_events_db
    expose:
      - "8000"
    networks:
      - web
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  plausible-db:
    image: postgres:17-alpine
    container_name: marshrut_plausible_db
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLAUSIBLE_DB_USER:?required}
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORD:?required}
      POSTGRES_DB: plausible
    volumes:
      - plausible_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  plausible-clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: marshrut_plausible_ch
    profiles: ["analytics"]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - plausible_ch_data:/var/lib/clickhouse
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# =============================================================
# Сети
#   - web:      доступна для Caddy и тех контейнеров, которые он проксирует
#   - internal: только для БД — без выхода наружу
# =============================================================
networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true

# =============================================================
# Тома — persistent storage
# =============================================================
volumes:
  caddy_data:
  caddy_config:
  listmonk_db_data:
  plausible_db_data:
  plausible_ch_data:
