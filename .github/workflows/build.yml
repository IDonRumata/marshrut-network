name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --allow-build=esbuild --allow-build=sharp

      - name: Build design tokens
        run: pnpm --filter=@marshrut/design-tokens build

      - name: Type check flagship
        run: pnpm --filter=@marshrut/flagship check

      - name: Build flagship
        run: pnpm --filter=@marshrut/flagship build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flagship-dist
          path: apps/flagship/dist/
          retention-days: 7
